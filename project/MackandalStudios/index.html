<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generative AI art and concept scenes from Mackandal Studios."
    />
    <title>Mackandal Studios · Sebastien Augustin</title>
    <link rel="icon" type="image/x-icon" href="/static/images/Logos/GMC.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Zalando+Sans+Expanded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
    <script src="../../static/js/shared.js" defer></script>
  </head>
  <body class="project-page" data-page="project">
    <main class="page">
      <div class="sectionTitleContainer project-intro">
        <h1 class="sectionTitle">Mackandal Studios</h1>
        <p class="sectionDescription">
          Exploring the future of generative AI through art, concept scenes,
          and visual stories at the edge of reality. All artwork is generated
          and copyrighted by Sebastien A.
        </p>
        <a
          href="https://www.instagram.com/mackandal.studios"
          target="_blank"
          rel="noopener noreferrer"
          class="services-text-link"
        >
          Follow on Instagram <span aria-hidden="true">↗</span>
        </a>
      </div>

      <section class="project-content" aria-label="Mackandal Studios galleries">
        <div class="gallery-grid" id="portfolioGallery"></div>
      </section>
    </main>

    <section
      class="project_preview"
      role="dialog"
      aria-modal="true"
      aria-label="Selected project gallery"
      aria-hidden="true"
    >
      <div class="project-preview-panel">
        <div class="project-preview-heading">
          <h2 class="projectTitle"></h2>
          <button
            class="project-preview-close"
            type="button"
            aria-label="Close gallery"
          >
            &times;
          </button>
        </div>
        <div class="projectGrid"></div>
      </div>
    </section>

    <script src="mackandalGallery.js"></script>
  </body>
</html>
